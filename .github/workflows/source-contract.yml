name: Source contract check

# Unit tests use saved fixtures, so this hits the real APIs weekly to catch
# format changes before the nightly job breaks.

on:
  schedule:
    - cron: "17 15 * * 1" # Mondays, 15:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # optional
      APINBA_KEY: ${{ secrets.APINBA_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: ESPN
        run: python backend/scripts/check_sources.py --source espn
      - name: API-NBA (only if the APINBA_KEY secret is set)
        if: env.APINBA_KEY != ''
        run: python backend/scripts/check_sources.py --source apinba
