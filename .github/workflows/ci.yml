name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the deploy workflow runs these checks first

# Read-only token by default
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the last
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # only needed for org-owned repos
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false # the report would include the secret

  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (includes the flake8-bandit security rules)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Sample data builds through the real pipeline
        run: PYTHONPATH=src python scripts/make_sample_data.py --site "$RUNNER_TEMP/site"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check frontend/app.js
      - name: No HTML-string sinks (required by the Trusted Types policy)
        run: |
          if grep -nE '\.(innerHTML|outerHTML)\s*=|insertAdjacentHTML|document\.write|\beval\(|new Function\(' frontend/app.js; then
            echo "app.js uses an HTML/script sink that the site's Content Security Policy blocks"; exit 1
          fi

  infra:
    name: CDK tests and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7 # the CDK library runs on Node.js
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Stack tests (security properties of the synthesized template)
        run: pytest
      - name: Synthesize the CloudFormation template
        run: npx --yes aws-cdk@2 synth --quiet
