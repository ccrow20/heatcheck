# Weekly update PRs for actions and dev deps. The Lambda has no deps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /infra
    schedule:
      interval: weekly
    groups:
      cdk:
        patterns: ["*"]
