[project]
name = "heatcheck"
version = "1.0.0"
description = "Nightly NBA hot/cold streak tracker that runs on AWS Lambda"
requires-python = ">=3.11"
dependencies = []  # standard library only; boto3 comes with the Lambda runtime

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff==0.16.9", "boto3>=1.34"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "RUF005"]  # assert is how pytest works; list concatenation reads fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "RUF001"]  # tests use curly apostrophes on purpose
"scripts/**" = ["S311"]

[tool.coverage.run]
source = ["heatcheck"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
